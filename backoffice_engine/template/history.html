


  <div class="container mx-auto py-8">
    <h2 class="text-2xl font-semibold mb-4">Your Chat History</h2>

    {% if records %}
      <div class="overflow-x-auto">
        <table class="min-w-full bg-white rounded-lg shadow">
          <thead class="bg-gray-100">
            <tr>
              <th class="px-4 py-2 text-left">Question</th>
              <th class="px-4 py-2 text-left">Answer</th>
            </tr>
          </thead>
          <tbody>
            {% for r in records %}
              <tr class="{% cycle 'bg-white' 'bg-gray-50' %}">
                <td class="border-t px-4 py-2 whitespace-normal break-words">
                  {{ r.question }}
                </td>
                <td class="border-t px-4 py-2 whitespace-normal break-words">
                  {{ r.answer }}
                </td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    {% else %}
      <p class="text-gray-600">You have no chat history yet. Start a conversation to see it here.</p>
    {% endif %}

    <div class="mt-6">
      <a href="{% url 'profile' %}" class="inline-block px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
        Back to Profile
      </a>
    </div>
  </div>
