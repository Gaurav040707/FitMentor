<!-- templates/update.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Update Profile | FitMentor</title>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      position: relative;
      overflow: hidden;
    }
    .dumbbell-bg {
      position: absolute; top: 0; left: 0;
      font-size: 40px; opacity: 0.05;
      animation: move 60s linear infinite;
      width: 100%; height: 100%;
      display: grid; place-items: center;
      pointer-events: none; white-space: pre-line;
      text-align: center;
    }
    @keyframes move {
      0% { transform: translateY(0); }
      100% { transform: translateY(-100%); }
    }
    .update-container {
      background: rgba(0,0,0,0.8);
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      width: 100%; max-width: 420px;
      backdrop-filter: blur(8px); z-index: 1;
    }
    h2 {
      text-align: center; margin-bottom: 24px;
      font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: #10a37f;
    }
    .form-group {
      margin: 15px 0; font-size: 15px;
    }
    label {
      display: block; margin-bottom: 6px;
      font-weight: 500; color: #ccc;
    }
    input {
      width: 100%; padding: 12px 14px;
      border: 1px solid #333; border-radius: 8px;
      background: #222; color: #eee;
      font-size: 15px; transition: border-color 0.3s;
    }
    input:focus { outline: none; border-color: #10a37f; }
    button {
      width: 100%; padding: 14px;
      margin-top: 20px; border: none;
      border-radius: 8px; background: #10a37f;
      color: white; font-weight: 600;
      text-transform: uppercase; cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    button:hover {
      background: #0e8a6a; transform: translateY(-2px);
    }
    .footer {
      position: absolute; bottom: 30px;
      width: 100%; text-align: center;
      font-size: 12px; color: #aaa; z-index: 1;
    }
  </style>
</head>

  
 
  
<body class="bg-black text-white">
<div class="dumbbell-bg">🏋🏋‍♂🏋‍♀🏋🏋‍♂🏋‍♀🏋🏋‍♂🏋‍♀🏋🏋‍♂🏋‍♀</div>

  <section class="py-20 px-4 max-w-2xl mx-auto">
    <h2 class="text-3xl font-bold text-center text-white mb-6">Update Profile</h2>

    {% if messages %}
      {% for message in messages %}
        <div class="text-center mb-4 text-sm {% if message.tags == 'success' %}text-green-400{% else %}text-red-400{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="/update/{{e.id}}" class="bg-gray-800 p-6 rounded-lg shadow space-y-4">
      {% csrf_token %}  
      <div>
        <label class="block text-gray-400">Name</label>
        <input type="text" name="name" value="{{ e.name }}" class="w-full bg-gray-700 text-white px-3 py-2 rounded">
      </div>
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded w-full">
        Update Profile
      </button>
    </form>

    <div style="text-align: center; margin-top: 16px;">
      <a href="/profile/" style="color: #10a37f; text-decoration: underline;">
        ← Back to Profile
      </a>
    </div>
  </section>
</body>
</html>
