<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | FitMentor</title>
  <style>
    /* Full CSS same as provided */
    @import url('https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      position: relative;
      overflow: hidden;
    }

    .dumbbell-bg {
      position: absolute;
      top: 0;
      left: 0;
      font-size: 40px;
      opacity: 0.05;
      animation: move 60s linear infinite;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      pointer-events: none;
      white-space: pre-line;
      text-align: center;
    }

    @keyframes move {
      0% { transform: translateY(0); }
      100% { transform: translateY(-100%); }
    }

    .auth-container {
      background: rgba(0, 0, 0, 0.8);
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      width: 100%;
      max-width: 380px;
      backdrop-filter: blur(8px);
      z-index: 1;
    }

    .auth-form {
      display: block;
      opacity: 1;
    }

    h2 {
      text-align: center;
      margin-bottom: 24px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      margin: 12px 0;
      border: 1px solid #333;
      border-radius: 8px;
      background: #222;
      color: #eee;
      font-size: 15px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #10a37f;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      background: #10a37f;
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background: #0e8a6a;
      transform: translateY(-2px);
    }

    .switch-link {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
    }

    .switch-link a {
      color: #fff;
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.3s;
    }

    .switch-link a:hover { color: #bbb; }
  </style>
</head>
<body>
  <div class="dumbbell-bg" title="Train with strength">
    🏋️ 🏋️‍♂️ 🏋️‍♀️ 🏋️‍♂️ 🏋️‍♀️ 🏋️ 🏋️‍♂️ 🏋️‍♀️ 🏋️ 🏋️‍♂️ 🏋️‍♀️ 🏋️ 🏋️‍♂️ 🏋️‍♀️ 🏋️
  </div>

  <div class="auth-container">
    <h1 style="text-align:center; margin-bottom: 10px; color:#10a37f; font-size: 28px;">FitMentor</h1>

    <form method="POST" action="" class="needs-validation" novalidate="">
      {% csrf_token %}
      <h2>Login</h2>
      <input type="email" name="email" placeholder="email" required />
      <div class="float-left">
        <a href="/sendotp/" class="text-small">
          Forgot Password?
        </a>
      </div>
      <input type="password" name="password" placeholder="Password" required />
      <div class="form-group">
        <button type="submit" class="btn btn-lg btn-block btn-auth-color" tabindex="4">
           Login
          </button>
          {% for data in messages %}
          <span>{{data}}</span>
          {% endfor %}
        </div>
       </form>
      <div class="switch-link">
        Don't have an account? <a href="/register/">Register</a>
      </div>
      <div style="text-align: center; margin-top: 16px;">
      <a href="/index/" style="color: #10a37f; text-decoration: underline;">
        ← Back to Home
      </a>
    </div>
    </form>
  </div>

  <div class="footer" style="position:absolute; bottom:30px; width:100%; text-align:center; font-size:12px; color:#aaa; z-index:1;">
    © 2025 <strong>FitMentor</strong> | All rights reserved
  </div>
</body>
</html>
